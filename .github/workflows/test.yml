name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm test
      - run: node scripts/check-assumed.mjs   # 0014 번호 인용 검사(Wave 5 회고, 결정 기록 0018)
